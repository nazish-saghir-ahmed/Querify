services:
  # Backend Web Service (Java Spring Boot)
  - type: web
    name: querify-backend
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8080
      - key: AI_MODE
        value: demo
