# =============================================================================
# Querify Backend Configuration
# =============================================================================
server.port=8080
spring.application.name=querify-backend

# -----------------------------------------------------------------------------
# Database Configuration (MySQL 8)
# Environment variables override defaults when supplied
# -----------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/querify_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Settings (Hibernate automatically auto-detects dialect)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# -----------------------------------------------------------------------------
# AI Engine Configuration
# Modes: "demo" (deterministic offline rule engine) or "live" (calls external AI API)
# Providers: "openrouter" (NVIDIA Nemotron 3.5 Super VL)
# -----------------------------------------------------------------------------
ai.provider=${AI_PROVIDER:openrouter}
ai.apiKey=${OPENROUTER_API_KEY:${AI_API_KEY:}}
ai.model=${AI_MODEL:nvidia/nemotron-3.5-super-vl:free}
ai.mode=${AI_MODE:live}

# -----------------------------------------------------------------------------
# Query Engine Security & Execution Safeguards
# -----------------------------------------------------------------------------
querify.query.max-limit=100
querify.query.timeout-seconds=5

# Logging configuration
logging.level.com.querify=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n
